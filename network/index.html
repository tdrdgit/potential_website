<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://potential.contractors/network/">
<title>Potential — Supply Network</title>
<style>
/* Palette corporate Potential: rosso, grigio, nero, bianco. Nient'altro.
   I dieci macro-ambiti NON hanno dieci colori: il grafo e' monocromo e il
   rosso e' riservato alla rilevanza. Quando si filtra un settore, i rami che
   servono si accendono. E' la stessa logica della headline bicolore del sito. */
:root{
  --pt-red:#C71617;
  --pt-gray:#D9D9D9;
  --pt-black:#000;
  --pt-white:#fff;
  --pt-near-black:#0A0A0A;
  --pt-hairline:#2E2E2E;
  --ink:#D9D9D9;
  --ink-dim:rgba(217,217,217,.52);
  --ink-faint:rgba(217,217,217,.28);
  --font:"Plain","Helvetica Neue",system-ui,-apple-system,Arial,sans-serif;
  --tracking:.18em;
  /* Un corpo solo per tutto il testo di contenuto della colonna: filtri,
     ricerca, capitoli e voci dell'albero. Restano piu' piccole solo le
     micro-etichette maiuscole, che sono insegne e non testo da leggere. */
  --txt:.68rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--pt-near-black)}
body{
  font-family:var(--font);font-weight:300;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
canvas{display:block;position:fixed;inset:0;cursor:grab}
canvas.dragging{cursor:grabbing}

/* ---------- gate ---------- */
#gate{
  position:fixed;inset:0;z-index:90;background:var(--pt-near-black);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .7s ease,visibility .7s;
}
#gate.open{opacity:0;visibility:hidden}
.gate-box{width:min(88vw,380px);text-align:left}
.eyebrow{
  font-size:.68rem;letter-spacing:var(--tracking);text-transform:uppercase;
  color:var(--pt-red);font-weight:400;
}
.eyebrow::before{content:"— "}
.gate-box .eyebrow{margin-bottom:4px;display:block}
.gate-field{display:flex;gap:0;margin-top:28px;border-bottom:1px solid var(--pt-hairline)}
.gate-field:focus-within{border-color:var(--pt-red)}
#pw{
  flex:1;background:none;border:0;outline:0;color:var(--ink);
  font-family:var(--font);font-size:.95rem;font-weight:300;padding:10px 2px;
  letter-spacing:.04em;
}
#pw::placeholder{color:var(--ink-faint)}
#go{
  background:none;border:0;color:var(--pt-red);cursor:pointer;
  font-family:var(--font);font-size:.68rem;letter-spacing:var(--tracking);
  text-transform:uppercase;padding:0 4px;
}
#gate-err{
  font-size:.7rem;color:var(--pt-red);margin-top:10px;height:1em;
  opacity:0;transition:opacity .25s;letter-spacing:.06em;
}
#gate-err.on{opacity:1}

/* ---------- chrome ---------- */
#ui{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .9s ease .25s}
#ui.on{opacity:1}
#ui > *{pointer-events:auto}

/* ---------- embed ---------- */
/* La home del sito incorpora questa stessa pagina in un iframe. La' cadono il
   gate e la colonna dei filtri, ma il grafo si tocca: hover, clic sui nodi,
   trascinamento e zoom funzionano come qui.
   La porta a password vale solo qui, a pagina piena, dove il grafo e' uno
   strumento: nella home e' un'immagine viva dentro la pagina di chiunque, e
   fermarla con una password vorrebbe dire lasciare un buco nero in mezzo al
   sito.
   L'unica cosa che non si prende e' la rotella nuda, che resta della pagina —
   il perche' sta sull'handler wheel piu' sotto. */
body.embed #gate,
body.embed #ui{display:none}

header{
  position:absolute;top:0;left:0;right:0;padding:22px clamp(16px,3.2vw,40px);
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
}
.brand{line-height:1.15}
.brand b{
  display:block;font-size:1.02rem;font-weight:500;letter-spacing:-.005em;
  color:var(--pt-white);
}
.brand span{display:block;font-size:.7rem;color:var(--ink-dim);margin-top:3px;max-width:38ch}

.langs{display:flex;gap:2px;flex-shrink:0}
.langs button{
  background:none;border:1px solid transparent;color:var(--ink-faint);
  font-family:var(--font);font-size:.66rem;letter-spacing:.12em;font-weight:400;
  text-transform:uppercase;padding:5px 9px;cursor:pointer;transition:.2s;
}
.langs button:hover{color:var(--ink)}
.langs button[aria-pressed="true"]{color:var(--pt-white);border-color:var(--pt-red)}

/* ---------- filtri ---------- */
#panel{
  position:absolute;left:clamp(16px,3.2vw,40px);top:104px;
  width:min(74vw,246px);display:flex;flex-direction:column;gap:14px;
  max-height:calc(100vh - 168px);
}
.panel-label{font-size:.62rem;letter-spacing:var(--tracking);text-transform:uppercase;color:var(--ink-faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  background:none;border:1px solid var(--pt-hairline);color:var(--ink-dim);
  font-family:var(--font);font-size:var(--txt);font-weight:300;letter-spacing:.02em;
  padding:5px 9px;cursor:pointer;transition:.22s;border-radius:1px;text-align:left;
}
.chip:hover{border-color:var(--ink-faint);color:var(--ink)}
.chip[aria-pressed="true"]{
  border-color:var(--pt-red);color:var(--pt-white);
  background:color-mix(in srgb,var(--pt-red) 16%,transparent);
}
#q{
  width:100%;background:none;border:0;border-bottom:1px solid var(--pt-hairline);
  color:var(--ink);font-family:var(--font);font-size:var(--txt);font-weight:300;
  padding:7px 1px;outline:0;
}
#q:focus{border-color:var(--pt-red)}
#q::placeholder{color:var(--ink-faint)}
.acts{display:flex;gap:14px}
.acts button{
  background:none;border:0;color:var(--ink-faint);cursor:pointer;padding:0;
  font-family:var(--font);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  transition:.2s;
}
.acts button:hover{color:var(--pt-red)}

/* ---------- navigatore ad albero ---------- */
/* Il grafo mostra la forma della rete, l'albero la sua struttura. Servono
   tutti e due: la costellazione convince, l'elenco si scorre. Partono tutti
   chiusi perche' dieci voci si leggono in un colpo d'occhio e novantuno no. */
#tree{
  overflow-y:auto;overscroll-behavior:contain;
  border-top:1px solid var(--pt-hairline);padding-top:10px;margin-top:2px;
  scrollbar-width:thin;scrollbar-color:var(--pt-hairline) transparent;
}
#tree::-webkit-scrollbar{width:3px}
#tree::-webkit-scrollbar-thumb{background:var(--pt-hairline)}
.tw-macro,.tw-leaf{
  display:block;width:100%;text-align:left;background:none;border:0;
  font-family:var(--font);cursor:pointer;transition:color .18s;
  padding:4px 0;line-height:1.3;
}
.tw-macro{
  font-size:var(--txt);font-weight:500;color:var(--ink);
  display:flex;gap:6px;align-items:baseline;
}
.tw-macro:hover{color:var(--pt-white)}
.tw-macro[aria-expanded="true"]{color:var(--pt-white)}
.tw-macro .tw-mark{
  color:var(--pt-red);font-size:.6rem;flex-shrink:0;width:7px;
  transition:transform .2s;display:inline-block;
}
.tw-macro[aria-expanded="true"] .tw-mark{transform:rotate(90deg)}
.tw-kids{margin:1px 0 6px 13px;border-left:1px solid var(--pt-hairline);padding-left:9px}
.tw-leaf{font-size:var(--txt);font-weight:300;color:var(--ink-dim);padding:3px 0}
.tw-leaf:hover{color:var(--ink)}
.tw-leaf[aria-current="true"],.tw-macro[aria-current="true"]{color:var(--pt-red)}

html[dir="rtl"] .tw-macro,html[dir="rtl"] .tw-leaf{text-align:right}
html[dir="rtl"] .tw-kids{margin:1px 13px 6px 0;border-left:0;border-right:1px solid var(--pt-hairline);padding:0 9px 0 0}
html[dir="rtl"] .tw-macro[aria-expanded="true"] .tw-mark{transform:rotate(-90deg)}


footer{
  position:absolute;left:clamp(16px,3.2vw,40px);bottom:clamp(16px,3.2vw,40px);
  font-size:.62rem;color:var(--ink-faint);letter-spacing:.04em;max-width:40ch;
}
#err{position:absolute;top:50%;left:0;right:0;text-align:center;font-size:.8rem;color:var(--pt-red)}

/* Arabo: si ribalta la cornice, non il grafo. */
html[dir="rtl"] header{flex-direction:row-reverse}
html[dir="rtl"] #panel{left:auto;right:clamp(16px,3.2vw,40px)}
html[dir="rtl"] footer{left:auto;right:clamp(16px,3.2vw,40px);text-align:right}
html[dir="rtl"] .eyebrow::before{content:"";}
html[dir="rtl"] .eyebrow::after{content:" —"}
html[dir="rtl"] .chip,html[dir="rtl"] #card p,html[dir="rtl"] .brand span{text-align:right}

@media (max-width:760px){
  #panel{width:calc(100% - 32px);top:96px}
  footer{display:none}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <header>
    <div class="brand">
      <b id="t-title">Il network Potential</b>
      <span id="t-sub">Ambiti di competenza della rete di fornitura</span>
    </div>
    <nav class="langs" id="langs"></nav>
  </header>

  <div id="panel">
    <div>
      <span class="panel-label" id="t-sectors">Settori</span>
      <div class="chips" id="chips" style="margin-top:8px"></div>
    </div>
    <input id="q" type="search" autocomplete="off" placeholder="Cerca un ambito">
    <div class="acts">
      <button id="b-expand"></button>
      <button id="b-reset"></button>
    </div>
    <nav id="tree" aria-label="tree"></nav>
  </div>

  <footer id="t-hint"></footer>
  <div id="err" hidden></div>
</div>

<div id="gate">
  <div class="gate-box">
    <span class="eyebrow" id="t-gate">Area riservata</span>
    <div class="gate-field">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
      <button id="go">Enter</button>
    </div>
    <div id="gate-err"></div>
  </div>
</div>

<script>
"use strict";

/* Sorgente dei dati. Lasciando il percorso relativo, HTML e JSON stanno nello
   stesso repository e si aggiornano insieme: rigenerare network.json e fare
   push e' tutto quello che serve perche' la pagina cambi. */
const DATA_URL = "network.json";

/* Modalita' embed: `?embed=1` per la sezione in home del sito, `&lang=xx` per
   farla parlare la lingua che il visitatore ha scelto la' sopra.
   Il sito copre cinque lingue e la tassonomia quattro, e le due liste non
   coincidono: chi guarda la home in cinese o in russo vede il grafo in
   inglese. Meglio dell'italiano, che sarebbe il default di questa pagina.
   ⚠️ Questo blocco vive nel sorgente in Brain e non nel repository del sito:
   publish.sh sovrascrive network/index.html a ogni pubblicazione, quindi una
   modifica fatta la' sparirebbe senza lasciare traccia. */
const PARAMS = new URLSearchParams(location.search);
const EMBED = PARAMS.get("embed") === "1";

/* La classe si mette subito, non a dati caricati: il gate e' un pannello nero a
   tutto schermo, e messa dopo il fetch lo si vedrebbe lampeggiare dentro
   l'iframe della home per tutto il tempo del caricamento. */
if (EMBED) document.body.classList.add("embed");

/* Una chiave per interlocutore, cosi' si sa a chi e' stato dato il link, e un
   livello per chiave. Aggiungerne una e' una riga qui dentro.
   `guest` e' l'esterno, `owner` e' Carlo.

   ⚠️ Sono offuscamento, non sicurezza, e il livello meno di tutto: chiavi e
   ruoli vivono nel sorgente, e chi apre il devtools legge le une e si assegna
   gli altri. Vale finche' cio' che il livello nasconde e' materiale che
   preferiremmo non mostrare, non materiale che non deve uscire — quello non
   entra proprio nel file pubblico, ed e' build_public.py a garantirlo. Per una
   porta vera servirebbe un server. */
const ACCESS = {
  welcome: "guest",
};
let ROLE = "guest";

const RED = "#C71617", GRAY = "#D9D9D9";

let DATA = null, LANG = "it";
let nodes = [], links = [], byId = new Map();
let view = { k: 1, x: 0, y: 0 };
let pointer = { x: -9e9, y: -9e9, inside: false };
let drag = null, hovered = null, focused = null, selected = null;

/* Monogramma corporate al centro del grafo: Potential_LogoP_red.svg, path
   originale invariato. Il rosso pieno e' riservato al marchio P. */
const MONOGRAM = new Image();
MONOGRAM.src = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70.179999 97.05" ' +
  'width="70.18" height="97.050003">' +
  '<g transform="translate(-1.13,-5.29)"><path fill="#c71617" ' +
  'd="m 34.72,59.46 c 12.15,0 21.87,-8 21.87,-20.44 0,-10.29 -7.58,-20.44 -21.87,-20.44 ' +
  'H 15.86 V 55.03 H 1.13 V 5.29 h 37.16 c 20.01,0 33.02,14.58 33.02,34.02 0,17.01 ' +
  '-11.01,33.45 -33.02,33.45 H 26.28 c -5.72,0 -10.43,4.72 -10.43,10.43 v 19.15 H 1.13 ' +
  'V 84.47 c 0,-13.86 11.15,-25.01 25.01,-25.01 z"/></g></svg>'
);

/* Altezza del monogramma in unita' di mondo, e le due misure che ne dipendono.
   MASK e' il disco di fondo pagina che si stampa sotto la P: la scorciatura dei
   raggi da sola non basta, perche' il glifo e' trasparente attorno alle aste e
   qualunque linea che passi li' sotto si vede lo stesso. CLEAR sta piu' dentro
   del disco di proposito, cosi' le punte dei raggi finiscono coperte e non
   lasciano un bordo circolare visibile. */
/* Una sola dimensione per tutto quello che si scrive sul grafo: nome del
   macro-ambito, nome del sotto-ambito, elenco delle competenze, referenze,
   nota. Le gerarchie le portano il peso e il colore — bianco pieno per il
   nodo, grigio per quello che gli sta dentro — non il corpo. Con tre corpi
   diversi in campo la mappa sembrava tre documenti sovrapposti. */
const TXT = 9.8;

const HUB_H = 34;
const HUB_MASK = HUB_H * 1.25;
const HUB_CLEAR = HUB_MASK - 5;

let activeSectors = new Set(), query = "";
let W = 0, H = 0, DPR = 1;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* ------------------------------------------------------------------ layout */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

/* ------------------------------------------------------------------- model */
function buildGraph(payload) {
  nodes = []; links = []; byId = new Map();

  const hub = {
    id: "__hub", parent: null, depth: 0, w: 6, hub: true,
    label: {}, blurb: {}, sectors: payload.sectors.map(s => s.id),
    x: 0, y: 0, vx: 0, vy: 0, open: true, r: 13, alpha: 1
  };
  nodes.push(hub); byId.set(hub.id, hub);

  const macros = payload.nodes.filter(n => n.parent === null);
  macros.forEach((n, i) => {
    const a = (i / macros.length) * Math.PI * 2 - Math.PI / 2;
    const node = Object.assign({}, n, {
      depth: 1, hub: false, open: true, alpha: 1,
      x: Math.cos(a) * 260, y: Math.sin(a) * 260, vx: 0, vy: 0,
      r: 8, angle: a
    });
    nodes.push(node); byId.set(node.id, node);
    links.push({ a: hub, b: node, rest: 250 });
  });

  payload.nodes.filter(n => n.parent !== null).forEach(n => {
    const parent = byId.get(n.parent);
    const kids = payload.nodes.filter(m => m.parent === n.parent);
    const idx = kids.indexOf(n);
    const spread = 1.35;
    const a = parent.angle + ((idx - (kids.length - 1) / 2) / Math.max(kids.length, 1)) * spread;
    const node = Object.assign({}, n, {
      depth: 2, hub: false, open: false, alpha: 1,
      x: parent.x + Math.cos(a) * 150, y: parent.y + Math.sin(a) * 150,
      vx: 0, vy: 0, r: 2.6 + n.w * 0.9, angle: a
    });
    nodes.push(node); byId.set(node.id, node);
    links.push({ a: parent, b: node, rest: 108 });
  });
}

/* Un nodo "risponde" a un settore se lo serve. Un macro-ambito risponde se
   almeno un suo sotto-ambito risponde: e' l'unione, calcolata a monte. */
function matchesSectors(n) {
  if (!activeSectors.size) return true;
  if (n.hub) return true;
  return n.sectors.some(s => activeSectors.has(s));
}
function matchesQuery(n) {
  if (!query) return true;
  if (n.hub) return true;
  const l = (n.label[LANG] || "") + " " + (n.blurb[LANG] || "");
  return l.toLowerCase().includes(query);
}
/* Il ramo scelto nell'elenco di sinistra e' un filtro a tutti gli effetti, non
   una semplice inquadratura: quello che sta fuori si spegne come con i settori.
   Con la sola inquadratura i rami vicini restavano in campo e l'elenco sembrava
   muovere la telecamera invece di selezionare. */
let branch = null;
function matchesBranch(n) {
  if (!branch) return true;
  if (n.hub) return true;
  const b = byId.get(branch);
  if (!b) return true;
  // Un capitolo tiene se stesso e i suoi paragrafi; una voce tiene se stessa e
  // il capitolo da cui esce, o si vedrebbe un nodo appeso al nulla.
  return b.depth === 1
    ? (n.id === b.id || n.parent === b.id)
    : (n.id === b.id || n.id === b.parent);
}
function isLive(n) { return matchesSectors(n) && matchesQuery(n) && matchesBranch(n); }

/* Il rosso indica UNA cosa sola: il nodo che hai scelto. Se lo usassimo anche
   per le corrispondenze di un filtro, un clic su un settore accenderebbe meta'
   grafo e il colore smetterebbe di voler dire qualcosa. Il filtro lavora per
   sottrazione: cio' che non serve si spegne e si ritira. */
function isHot(n) {
  return !n.hub && selected === n.id;
}

function inFocus(n) {
  if (!focused) return true;
  if (n.hub) return true;
  return n.id === focused || n.parent === focused || n.id === byId.get(focused).parent;
}

/* ------------------------------------------------------------------ physics */
function step() {
  const cx = W / 2, cy = H / 2;

  for (const n of nodes) {
    const live = isLive(n), foc = inFocus(n);
    // un nodo spento si ritira: piu' piccolo, piu' trasparente, piu' vicino al
    // padre. L'albero si contrae attorno a cio' che serve davvero.
    const target = (live ? 1 : 0.13) * (foc ? 1 : 0.28);
    n.alpha += (target - n.alpha) * 0.09;
  }

  for (const l of links) {
    const live = isLive(l.b) && inFocus(l.b);
    const rest = l.rest * (live ? 1 : 0.42) * (l.b.depth === 2 && !l.a.open ? 0.12 : 1);
    let dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    let d = Math.hypot(dx, dy) || 0.01;
    const f = (d - rest) * 0.0075;
    dx /= d; dy /= d;
    l.a.vx += dx * f; l.a.vy += dy * f;
    l.b.vx -= dx * f; l.b.vy -= dy * f;
  }

  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 > 62000) continue;
      const d = Math.sqrt(d2) || 0.01;
      const f = (900 * a.alpha * b.alpha) / d2;
      dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f;
      b.vx += dx * f; b.vy += dy * f;
    }
  }

  // Il cursore increspa il grafo a distanza e lo lascia fermo da vicino.
  //
  // La prima versione spingeva piu' forte man mano che ci si avvicinava, che e'
  // esattamente il contrario di quello che serve: il nodo che stai per cliccare
  // era quello che scappava di piu'. Qui la spinta e' una fascia — nulla dentro
  // CALM, cresce fino a meta' e si spegne a REACH. Attorno al puntatore c'e'
  // percio' una zona morta larga il doppio di un nodo: si vede il grafo
  // reagire, ma il bersaglio sta dove l'hai visto.
  if (pointer.inside && !drag) {
    const wx = (pointer.x - view.x - cx) / view.k;
    const wy = (pointer.y - view.y - cy) / view.k;
    const CALM = 70, REACH = 190, BAND = REACH - CALM;
    for (const n of nodes) {
      if (n.hub) continue;
      let dx = n.x - wx, dy = n.y - wy;
      const d = Math.hypot(dx, dy) || 0.01;
      if (d <= CALM || d >= REACH) continue;
      const t = (d - CALM) / BAND;
      const f = Math.sin(t * Math.PI) * 0.1;
      n.vx += (dx / d) * f; n.vy += (dy / d) * f;
    }
  }

  // I dieci macro-ambiti tornano sempre verso la loro posizione sull'anello.
  // Senza questo richiamo la simulazione li accavalla su un lato e l'albero
  // diventa illeggibile: e' il vincolo che tiene la complessita' governata
  // senza congelare il movimento.
  const ring = Math.min(W, H) * 0.31 + 96;
  for (const n of nodes) {
    if (n.depth !== 1) continue;
    const tx = Math.cos(n.angle) * ring, ty = Math.sin(n.angle) * ring;
    n.vx += (tx - n.x) * 0.0135;
    n.vy += (ty - n.y) * 0.0135;
  }

  for (const n of nodes) {
    if (n.hub) { n.vx -= n.x * 0.05; n.vy -= n.y * 0.05; }
    else if (n.depth === 2) { n.vx -= n.x * 0.0006; n.vy -= n.y * 0.0006; }
    n.vx *= 0.86; n.vy *= 0.86;
    n.x += n.vx; n.y += n.vy;
  }
}

/* ------------------------------------------------------------------ render */
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2 + view.x, H / 2 + view.y);
  ctx.scale(view.k, view.k);

  // Due livelli di linea, due gerarchie. Dal centro ai macro-ambiti la linea e'
  // bianca e piena: e' la struttura portante. Dai macro ai sotto-ambiti e'
  // grigia e sottile: e' ramificazione. Con lo stesso tratto per entrambe
  // l'albero si legge come una rete piatta e la gerarchia sparisce.
  for (const l of links) {
    const a = Math.min(l.a.alpha, l.b.alpha);
    if (a < 0.03) continue;
    const trunk = l.a.hub;
    // I raggi si fermano prima del monogramma invece di attraversarlo: dieci
    // linee bianche che convergono dentro la P la rendono illeggibile, e il
    // marchio e' l'unica cosa in pagina che non deve mai risultare sporca.
    let ax = l.a.x, ay = l.a.y;
    if (trunk) {
      const dx = l.b.x - ax, dy = l.b.y - ay;
      const d = Math.hypot(dx, dy) || 1;
      const clear = HUB_CLEAR;
      if (d <= clear) continue;
      ax += (dx / d) * clear; ay += (dy / d) * clear;
    }
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(l.b.x, l.b.y);
    ctx.strokeStyle = isHot(l.b)
      ? `rgba(199,22,23,${0.62 * a})`
      : trunk
        ? `rgba(255,255,255,${0.5 * a})`
        : `rgba(217,217,217,${0.16 * a})`;
    ctx.lineWidth = (trunk ? 1.15 : 0.5) / view.k;
    ctx.stroke();
  }

  for (const n of nodes) {
    if (n.alpha < 0.03) continue;
    const hot = isHot(n), hov = hovered === n.id;
    const r = n.r * (hov ? 1.5 : hot ? 1.22 : 1) * (0.42 + 0.58 * n.alpha);

    // Sotto il monogramma il fondo torna pieno. Accorciare i raggi non basta:
    // il glifo e' trasparente attorno alle aste, e li' sotto si vede tutto
    // quello che passa. Il disco va prima dell'alone, cosi' il rosso resta
    // sopra e la P non finisce dentro un buco nero.
    if (n.hub) {
      ctx.fillStyle = "#0A0A0A";
      ctx.beginPath(); ctx.arc(n.x, n.y, HUB_MASK, 0, 7); ctx.fill();
    }

    // L'alone sta SOLO sull'hub e sul nodo sotto il cursore. Su ogni nodo
    // acceso i quaranta aloni di un filtro si sommano in una macchia rossa e
    // il grafo sparisce: l'accensione la portano il riempimento e il link.
    if (n.hub || hov) {
      const halo = r * (n.hub ? 4.4 : 3.4);
      const g = ctx.createRadialGradient(n.x, n.y, r * 0.5, n.x, n.y, halo);
      g.addColorStop(0, `rgba(199,22,23,${(n.hub ? 0.13 : 0.24) * n.alpha})`);
      g.addColorStop(0.35, `rgba(199,22,23,${(n.hub ? 0.05 : 0.09) * n.alpha})`);
      g.addColorStop(1, "rgba(199,22,23,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, halo, 0, 7); ctx.fill();
    }

    // Il centro e' il monogramma, non un pallino con una scritta.
    if (n.hub) {
      if (MONOGRAM.complete && MONOGRAM.naturalWidth) {
        const mh = HUB_H, mw = mh * (70.18 / 97.05);
        ctx.globalAlpha = 0.96;
        ctx.drawImage(MONOGRAM, n.x - mw / 2, n.y - mh / 2, mw, mh);
        ctx.globalAlpha = 1;
      }
      continue;
    }

    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, 7);
    ctx.fillStyle = hot
      ? `rgba(199,22,23,${Math.min(1, n.alpha + 0.15)})`
      : n.depth === 1
        ? `rgba(10,10,10,${n.alpha})`
        : `rgba(217,217,217,${0.42 * n.alpha})`;
    ctx.fill();

    // I macro-ambiti sono cerchi vuoti con il bordo chiaro: si distinguono dai
    // sotto-ambiti per forma e non solo per dimensione, che a zoom basso non
    // si legge.
    if (n.depth === 1) {
      ctx.lineWidth = 1.15 / view.k;
      ctx.strokeStyle = hot
        ? `rgba(255,255,255,${0.85 * n.alpha})`
        : `rgba(255,255,255,${0.8 * n.alpha})`;
      ctx.stroke();
    }

    // Le etichette dei sotto-ambiti compaiono con lo zoom o col filtro: alla
    // prima apertura si vede la costellazione, non ottantuno scritte.
    n.hit = null;
    const showLabel = n.depth === 1 || hov || hot || view.k > 1.55
      || (focused && n.parent === focused)
      || ((activeSectors.size || query) && isLive(n));
    if (!showLabel || n.alpha < 0.18) continue;
    if (focused && !inFocus(n)) continue;

    const size = TXT / view.k;
    ctx.font = `${n.depth === 2 ? 300 : 500} ${size}px "Plain","Helvetica Neue",system-ui,Arial,sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const text = n.label[LANG] || n.label.en || n.id;
    const y = n.y + r + 6 / view.k;

    const wpx = ctx.measureText(text).width;
    if (n.depth === 2 || hov) {
      ctx.fillStyle = `rgba(10,10,10,${0.62 * n.alpha})`;
      ctx.fillRect(n.x - wpx / 2 - 3 / view.k, y - 1.5 / view.k, wpx + 6 / view.k, size * 1.32);
    }

    ctx.fillStyle = (hot || hov)
      ? `rgba(255,255,255,${n.alpha})`
      : n.depth === 2
        ? `rgba(217,217,217,${0.62 * n.alpha})`
        : `rgba(255,255,255,${0.92 * n.alpha})`;
    ctx.fillText(text, n.x, y);
    // Il bersaglio del clic parte dal pallino e arriva sotto la scritta, con
    // un margine in unita' di schermo: dimezzando il corpo si dimezzerebbe
    // anche l'area cliccabile, e la scritta e' il punto in cui si mira.
    n.hit = { x0: n.x - wpx / 2 - 6 / view.k, x1: n.x + wpx / 2 + 6 / view.k,
              y0: n.y - r - 4 / view.k, y1: y + size * 1.3 + 4 / view.k };

    // Il dettaglio del nodo scelto si apre QUI, sotto il suo nome, nella
    // stessa tipografia e in grigio. Niente pannello, niente popup: il
    // contenuto non si stacca mai dall'oggetto a cui appartiene, e non serve
    // attraversare lo schermo per capire di chi si sta parlando.
    if (!hot) continue;
    // Separatore punto e virgola: diverse voci contengono virgole interne, e
    // l'arabo usa la propria. Splittare sulla virgola le spezzerebbe a meta'.
    const detail = n.scope && n.scope[LANG]
      ? n.scope[LANG].split(";").map(v => v.trim()).filter(Boolean) : [];
    if (!detail.length) continue;

    const ds = TXT / view.k, lh = ds * 1.62;
    const top = y + size * 1.55;
    let dy = y + size * 1.9;
    ctx.font = `300 ${ds}px "Plain","Helvetica Neue",system-ui,Arial,sans-serif`;

    // Fondo dietro al blocco: senza, l'elenco cade sopra i link e sopra il
    // monogramma quando il nodo e' vicino al centro, e diventa illeggibile.
    let bw = 0;
    for (const item of detail) bw = Math.max(bw, ctx.measureText(item).width);
    const pad = 7 / view.k;
    ctx.fillStyle = `rgba(10,10,10,${0.86 * n.alpha})`;
    ctx.fillRect(n.x - bw / 2 - pad, top - pad * 0.5, bw + pad * 2, detail.length * lh + pad * 1.4);

    for (const item of detail) {
      ctx.fillStyle = `rgba(217,217,217,${0.62 * n.alpha})`;
      ctx.fillText(item, n.x, dy);
      dy += lh;
    }
  }

  ctx.restore();
}

/* ------------------------------------------------------------------ camera */
/* Un clic non salta: la vista ci arriva. Il salto secco fa perdere il filo di
   dove si era, l'inquadratura che si avvicina lo mantiene — e' la stessa
   ragione per cui il grafo non si ferma mai del tutto. */
let camTarget = null;

function fitTo(list, margin) {
  if (!list.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of list) {
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y);
  }
  // le etichette stanno sotto al nodo e sporgono di lato: la gabbia si allarga
  // di conseguenza, o il testo dei nodi di bordo esce dallo schermo
  const w = Math.max(x1 - x0, 120) + margin * 2;
  const h = Math.max(y1 - y0, 120) + margin * 2;
  const k = Math.min(2.6, Math.max(0.5, Math.min(W / w, H / h)));
  camTarget = {
    k,
    x: -((x0 + x1) / 2) * k,
    y: -((y0 + y1) / 2) * k,
  };
}

function fitAll() { fitTo(nodes, 130); }

function easeCamera() {
  if (!camTarget) return;
  view.k += (camTarget.k - view.k) * 0.11;
  view.x += (camTarget.x - view.x) * 0.11;
  view.y += (camTarget.y - view.y) * 0.11;
  if (Math.abs(camTarget.k - view.k) < 0.004 &&
      Math.hypot(camTarget.x - view.x, camTarget.y - view.y) < 1.2) {
    camTarget = null;
  }
}

/* In embed il cursore non c'e', e senza increspatura la simulazione si assesta
   in pochi secondi: il grafo diventa una fotografia, e una fotografia in home
   non dice che dietro c'e' un archivio vivo.
   Il rimedio non e' una seconda animazione ma un puntatore finto che gira
   piano: attraversa la stessa fascia di forze dell'hover, quindi il movimento
   e' esattamente quello che il grafo fa gia' quando qualcuno lo guarda. Due
   periodi diversi sui due assi perche' l'ellisse non si richiuda su se stessa
   e il giro non si riconosca. */
/* Vero quando c'e' un cursore in carne e ossa sopra il canvas. Serve solo in
   embed, per sapere quando togliere di mezzo il puntatore finto: i due scrivono
   sulla stessa variabile, e a lasciarli accesi insieme l'evidenziazione
   rimbalzerebbe fra il nodo sotto il mouse e quello sotto il fantasma. Il drift
   riprende appena il cursore esce, cosi' la mappa non si irrigidisce in
   fotografia quando nessuno la guarda. */
let hasRealPointer = false;

function driftPointer() {
  const t = performance.now() / 9000;
  pointer.x = W / 2 + Math.cos(t) * W * 0.3;
  pointer.y = H / 2 + Math.sin(t * 0.83) * H * 0.3;
  pointer.inside = true;
}

function loop() {
  if (EMBED && !hasRealPointer) driftPointer();
  step(); easeCamera(); draw(); requestAnimationFrame(loop);
}

/* ------------------------------------------------------------- interazione */
function pick(px, py) {
  const wx = (px - view.x - W / 2) / view.k;
  const wy = (py - view.y - H / 2) / view.k;
  let best = null, bestD = 34 / view.k;
  for (const n of nodes) {
    if (n.hub || n.alpha < 0.2) continue;
    const d = Math.hypot(n.x - wx, n.y - wy);
    if (d < Math.max(bestD, n.r + 9 / view.k)) { best = n; bestD = d; }
  }
  if (best) return best;

  // nessun pallino sotto il cursore: si prova con le etichette
  for (const n of nodes) {
    const b = n.hit;
    if (!b || n.alpha < 0.2) continue;
    if (wx >= b.x0 && wx <= b.x1 && wy >= b.y0 && wy <= b.y1) return n;
  }
  return null;
}

canvas.addEventListener("mousemove", e => {
  hasRealPointer = true;
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true;
  if (drag) {
    view.x = drag.vx + (e.clientX - drag.x);
    view.y = drag.vy + (e.clientY - drag.y);
    return;
  }
  const n = pick(e.clientX, e.clientY);
  const id = n ? n.id : null;
  if (id !== hovered) {
    hovered = id;
    // una selezione fissata vince sull'hover: chi ha cliccato vuole tenere
    // quella scheda aperta mentre esplora il resto
  }
});
canvas.addEventListener("mouseleave", () => {
  hasRealPointer = false; pointer.inside = false; hovered = null;
});
canvas.addEventListener("mousedown", e => {
  camTarget = null;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y,
           moved: false, t: performance.now() };
  canvas.classList.add("dragging");
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  drag.dist = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
  if (drag.dist > 8) drag.moved = true;
});
window.addEventListener("mouseup", e => {
  // Il mouseup sta su window e non sul canvas perche' una trascinata puo'
  // finire fuori dal grafo. Ma se non era partita di li' l'evento non ci
  // riguarda, e va lasciato passare: syncTree() rifa' l'elenco da capo, e
  // rifarlo fra il mousedown e il click di un pulsante della colonna cancella
  // quel pulsante prima che il click gli arrivi. E' il motivo per cui i
  // capitoli dell'albero non si aprivano: il click non veniva mai emesso.
  if (!drag) return;

  // Il tremolio da trackpad e la trascinata rapida si somigliano nel tempo
  // ma non nello spazio: il perdono vale solo se il cursore e' rimasto
  // dentro un raggio stretto, o una passata veloce selezionerebbe.
  const tap = !drag.moved;
  const jitter = (performance.now() - drag.t) < 300 && (drag.dist || 0) < 22;
  if (tap || jitter) {
    const n = pick(e.clientX, e.clientY);
    if (!n) {
      // clic nel vuoto: si esce e si torna a vedere tutto
      selected = null; focused = null; branch = null;
      openMacros.clear();
      fitAll();
    } else if (selected === n.id) {
      selected = null; branch = null;
      if (n.depth === 1) focused = null;
      fitAll();
    } else {
      // Il grafo e' esplorazione, non filtro: si esce dal ramo filtrato solo
      // quando si va a toccare qualcosa che ne sta fuori. Cliccare dentro il
      // ramo che si e' appena scelto nell'elenco non deve riaprire tutto.
      if (branch && !matchesBranch(n)) branch = null;
      selected = n.id;
      const kids = nodes.filter(m => m.parent === n.id);
      if (n.depth === 1) {
        focused = n.id;
        // il macro-ambito si inquadra con tutti i suoi sotto-ambiti
        fitTo([n, ...kids], 150);
      } else {
        focused = n.parent;
        // una foglia non ha figli: si inquadra lei e il gruppo da cui esce,
        // cosi' si vede dove sta senza perdere il contesto
        fitTo([n, byId.get(n.parent)], 210);
      }
    }
  }
  syncTree();
  drag = null; canvas.classList.remove("dragging");
});
canvas.addEventListener("wheel", e => {
  /* In embed la rotella nuda deve restare della pagina. Se la prendesse il
     grafo, chi arriva scrollando dall'alto smetterebbe di scendere appena il
     cursore entra nell'iframe, e resterebbe incastrato a meta' sito senza
     capire perche'.
     Lo zoom c'e' lo stesso, ma chiede ctrl o cmd: e' la convenzione delle
     mappe incorporate, e il gesto che si fa per sbaglio non e' mai quello con
     il tasto premuto. Sulla pagina intera non serve nulla di tutto questo,
     perche' li' sotto non c'e' pagina da scorrere. */
  if (EMBED && !e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  camTarget = null;
  const k = Math.min(2.8, Math.max(0.45, view.k * (e.deltaY < 0 ? 1.09 : 0.917)));
  const mx = e.clientX - W / 2 - view.x, my = e.clientY - H / 2 - view.y;
  view.x -= mx * (k / view.k - 1); view.y -= my * (k / view.k - 1);
  view.k = k;
}, { passive: false });

let touch = null;
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0];
  touch = { x: t.clientX, y: t.clientY, vx: view.x, vy: view.y };
}, { passive: true });
canvas.addEventListener("touchmove", e => {
  // Stessa ragione della rotella, col dito: in embed il trascinamento e' della
  // pagina. Il tocco secco su un nodo continua a funzionare, perche' lo gestisce
  // touchend e non passa di qui.
  if (EMBED) return;
  if (!touch) return;
  const t = e.touches[0];
  view.x = touch.vx + (t.clientX - touch.x);
  view.y = touch.vy + (t.clientY - touch.y);
}, { passive: true });
canvas.addEventListener("touchend", e => {
  const t = e.changedTouches[0];
  if (touch && Math.hypot(t.clientX - touch.x, t.clientY - touch.y) < 6) {
    const n = pick(t.clientX, t.clientY);
    if (n) {
      if (branch && !matchesBranch(n)) branch = null;
      hovered = n.id; selected = n.id;
      const kids = nodes.filter(m => m.parent === n.id);
      if (n.depth === 1) { focused = n.id; fitTo([n, ...kids], 150); }
      else { focused = n.parent; fitTo([n, byId.get(n.parent)], 210); }
    } else { selected = null; focused = null; branch = null; fitAll(); }
  }
  touch = null;
}, { passive: true });


/* ------------------------------------------------------- navigatore albero */
/* Aperto/chiuso vive qui e non nel grafo: sono due letture della stessa cosa
   e devono poter divergere. Aprire un capitolo nell'elenco inquadra il ramo,
   ma scorrere l'elenco non deve muovere la vista a ogni riga. */
const openMacros = new Set();

function esc(v) {
  return String(v).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderTree() {
  const root = document.getElementById("tree");
  if (!root || !DATA) return;
  const lbl = n => n.label[LANG] || n.label.en || n.id;
  let html = "";
  for (const m of DATA.nodes.filter(n => n.parent === null)) {
    const open = openMacros.has(m.id);
    html += `<button class="tw-macro" data-id="${m.id}" aria-expanded="${open}"` +
            ` aria-current="${selected === m.id}">` +
            `<span class="tw-mark">&#9656;</span><span>${esc(lbl(m))}</span></button>`;
    if (!open) continue;
    html += '<div class="tw-kids">';
    for (const k of DATA.nodes.filter(n => n.parent === m.id)) {
      html += `<button class="tw-leaf" data-id="${k.id}"` +
              ` aria-current="${selected === k.id}">${esc(lbl(k))}</button>`;
    }
    html += "</div>";
  }
  root.innerHTML = html;

  root.querySelectorAll(".tw-macro").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;
      if (openMacros.has(id)) {
        // secondo clic sullo stesso capitolo: si richiude e il filtro cade
        openMacros.delete(id);
        branch = null; focused = null; selected = null;
        fitAll();
      } else {
        // un capitolo alla volta: dieci aperti sono di nuovo novantuno righe
        openMacros.clear();
        openMacros.add(id);
        branch = id; focused = id; selected = id;
        fitTo([byId.get(id), ...nodes.filter(n => n.parent === id)], 150);
      }
      renderTree();
    };
  });
  root.querySelectorAll(".tw-leaf").forEach(b => {
    b.onclick = () => {
      const n = byId.get(b.dataset.id);
      // secondo clic sulla stessa voce: si risale al capitolo, non si esce
      if (branch === n.id) {
        branch = n.parent; selected = n.parent; focused = n.parent;
        fitTo([byId.get(n.parent), ...nodes.filter(m => m.parent === n.parent)], 150);
      } else {
        branch = n.id; selected = n.id; focused = n.parent;
        fitTo([n, byId.get(n.parent)], 210);
      }
      renderTree();
    };
  });
}

/* Il grafo e l'elenco restano allineati: quello che si sceglie di la' si apre
   di qua, senza che l'utente debba ritrovarlo a mano. */
function syncTree() {
  if (!selected) { renderTree(); return; }
  const n = byId.get(selected);
  const macro = n.parent || n.id;
  if (!openMacros.has(macro)) { openMacros.clear(); openMacros.add(macro); }
  renderTree();
}

/* ------------------------------------------------------------------- lingua */
const LANG_LABEL = { it: "ITA", en: "ENG", is: "ÍSL", ar: "عربي" };

function applyLang(l) {
  LANG = l;
  const ui = DATA.ui, t = k => (ui[k] && ui[k][l]) || "";
  const rtl = DATA.rtl.includes(l);
  document.documentElement.lang = l;
  document.documentElement.dir = rtl ? "rtl" : "ltr";

  document.getElementById("t-title").textContent = t("title");
  document.getElementById("t-sub").textContent = t("subtitle");
  document.getElementById("t-sectors").textContent = t("sectors");
  document.getElementById("t-gate").textContent = t("gate_intro");
  document.getElementById("t-hint").textContent = t("hint");
  document.getElementById("q").placeholder = t("search");
  document.getElementById("pw").placeholder = t("password");
  document.getElementById("go").textContent = t("enter");
  document.getElementById("b-expand").textContent = t("all_sectors");
  document.getElementById("b-reset").textContent = t("reset");
  document.title = "Potential — " + t("title");

  document.querySelectorAll("#langs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.l === l)));
  document.querySelectorAll("#chips .chip").forEach(b => {
    const s = DATA.sectors.find(x => x.id === b.dataset.s);
    b.textContent = s.label[l] || s.label.en;
  });
}

/* --------------------------------------------------------------------- boot */
function mountChrome() {
  const langs = document.getElementById("langs");
  DATA.languages.forEach(l => {
    const b = document.createElement("button");
    b.dataset.l = l; b.textContent = LANG_LABEL[l] || l.toUpperCase();
    b.onclick = () => applyLang(l);
    langs.appendChild(b);
  });

  const chips = document.getElementById("chips");
  DATA.sectors.forEach(s => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.s = s.id;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      if (activeSectors.has(s.id)) activeSectors.delete(s.id);
      else activeSectors.add(s.id);
      b.setAttribute("aria-pressed", String(activeSectors.has(s.id)));
    };
    chips.appendChild(b);
  });

  document.getElementById("q").addEventListener("input", e => {
    query = e.target.value.trim().toLowerCase();
  });
  document.getElementById("b-expand").onclick = () => {
    activeSectors.clear();
    document.querySelectorAll("#chips .chip").forEach(b => b.setAttribute("aria-pressed", "false"));
  };
  document.getElementById("b-reset").onclick = () => {
    activeSectors.clear(); query = ""; focused = null; selected = null; branch = null;
    openMacros.clear(); renderTree();
    document.getElementById("q").value = "";
    document.querySelectorAll("#chips .chip").forEach(b => b.setAttribute("aria-pressed", "false"));
    fitAll();
  };
}

/* Apre la porta e accende la colonna dei filtri, che resta spenta finche' la
   password non e' passata. */
function openGate() {
  document.getElementById("gate").classList.add("open");
  document.getElementById("ui").classList.add("on");
}
function tryGate() {
  const v = document.getElementById("pw").value.trim().toLowerCase();
  if (ACCESS[v]) { ROLE = ACCESS[v]; openGate(); return; }
  const e = document.getElementById("gate-err");
  e.textContent = (DATA && DATA.ui.wrong[LANG]) || "Password non valida";
  e.classList.add("on");
  setTimeout(() => e.classList.remove("on"), 2200);
}
document.getElementById("go").onclick = tryGate;
document.getElementById("pw").addEventListener("keydown", e => {
  if (e.key === "Enter") tryGate();
});

resize();
fetch(DATA_URL, { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(payload => {
    DATA = payload;
    buildGraph(payload);
    mountChrome();
    renderTree();
    const want = EMBED
      ? (PARAMS.get("lang") || "").slice(0, 2)
      : (navigator.language || "it").slice(0, 2);
    applyLang(DATA.languages.includes(want) ? want : (EMBED ? "en" : "it"));
    if (EMBED) {
      // Niente gate da aprire e niente chrome da accendere: si mostra solo il
      // grafo, inquadrato subito su tutto perche' nessuno potra' allargarlo.
      fitAll();
    } else {
      document.getElementById("pw").focus();
    }
    loop();
  })
  .catch(err => {
    const e = document.getElementById("err");
    e.hidden = false;
    e.textContent = "network.json non raggiungibile (" + err.message + ")";
    // La porta si apre da sola: dietro non c'e' piu' niente da proteggere, e a
    // porta chiusa l'errore resterebbe invisibile sotto il pannello nero.
    openGate();
  });
</script>
